name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    name: "Test — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true # non-blocking until type coverage is complete

      - name: Unit tests
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -v

      - name: Integration tests (no AWS required — mocked)
        run: |
          pytest tests/integration/ \
            -v \
            --timeout=30
        env:
          MODEL_PATH: models/rand_forest_v1.pkl
          AWS_DEFAULT_REGION: us-east-1
          # Moto mocks AWS in integration tests — no real credentials needed

      - name: Build Docker image (smoke test)
        run: |
          docker build -t car-valuation-api:ci-${{ github.sha }} .
          docker run --rm \
            -e MODEL_PATH=models/rand_forest_v1.pkl \
            -e AWS_DEFAULT_REGION=us-east-1 \
            car-valuation-api:ci-${{ github.sha }} \
            python -c "from src.api.app import app; print('Import OK')"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: htmlcov/
